name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quickpro_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:test:reset
      - run: pnpm test:db
      - run: pnpm build

  # Real Supabase stack (Auth, Storage, Postgres with the migrations and seed)
  # from the Supabase CLI. Keys are the CLI's local development defaults.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor
      - name: Write .env.local from the local stack
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$DB_URL"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "FILE_STORAGE_DRIVER=supabase"
            echo "STORAGE_TEST_SUPABASE_URL=$API_URL"
            echo "STORAGE_TEST_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "STORAGE_TEST_ANON_KEY=$ANON_KEY"
            echo "STORAGE_TEST_DATABASE_URL=$DB_URL"
          } > .env.local
      - name: Storage integration tests
        run: set -a && . ./.env.local && set +a && pnpm test:storage
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: |
          set -a && . ./.env.local && set +a
          pnpm start > next.log 2>&1 &
          npx --yes wait-on@8.0.3 --timeout 60000 http://localhost:3000
          pnpm test:e2e
      - if: failure()
        run: tail -100 next.log || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
