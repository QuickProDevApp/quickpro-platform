name: Supabase preview migrations

# Manually applies supabase/migrations to the QuickPro Preview project only.
# Run it from the Actions tab with "Use workflow from: main". It checks out
# the application branch named in app_branch (phase-1-foundation by default)
# and takes the migrations and lockfile from there, so Phase 1 does not need
# to be merged first.
#
#   mode = plan   connects through the IPv4 session pooler and shows
#                 `db push --dry-run`. Changes nothing.
#   mode = apply  same checks, then applies the migrations and runs read-only
#                 verification. Requires typing the project ref to confirm.
#
# It never resets the database, never runs seed.sql, and never pushes auth or
# storage settings. Secrets come from the repository's Actions secrets and are
# masked in logs by GitHub.
on:
  workflow_dispatch:
    inputs:
      app_branch:
        description: "Branch with the application and migrations"
        type: string
        default: phase-1-foundation
        required: true
      mode:
        description: "plan (dry run, changes nothing) or apply"
        type: choice
        options: [plan, apply]
        default: plan
      confirm_project_ref:
        description: "For apply: type lwqlhifdxefboanvoooh to confirm"
        type: string
        required: false

concurrency:
  group: supabase-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: lwqlhifdxefboanvoooh # QuickPro Preview. Do not change without review.
      PROJECT_NAME: QuickPro Preview
      MODE: ${{ inputs.mode }}
      APP_BRANCH: ${{ inputs.app_branch }}
      CONFIRM: ${{ inputs.confirm_project_ref }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check inputs and secrets
        run: |
          echo "Mode: $MODE. Application branch: $APP_BRANCH. Target: $PROJECT_NAME ($PROJECT_REF)."
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "$PROJECT_REF" ]; then
            echo "::error::To apply, type $PROJECT_REF in the confirmation box."; exit 1
          fi
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::SUPABASE_DB_PASSWORD secret is not set"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_branch }}
      - name: Check the application branch
        run: |
          echo "Checked out $APP_BRANCH at $(git rev-parse --short HEAD)"
          test -f pnpm-lock.yaml || { echo "::error::$APP_BRANCH has no pnpm-lock.yaml. Is it the application branch?"; exit 1; }
          ls supabase/migrations/*.sql >/dev/null 2>&1 || { echo "::error::$APP_BRANCH has no supabase/migrations."; exit 1; }
          test -f supabase/checks/verify-deployment.sql || { echo "::error::$APP_BRANCH has no supabase/checks/verify-deployment.sql."; exit 1; }
          ls -1 supabase/migrations
      - name: Refuse destructive statements in migrations
        run: |
          if grep -niE '\b(drop[[:space:]]+(table|schema|database|column)|truncate|delete[[:space:]]+from)\b' supabase/migrations/*.sql; then
            echo "::error::A migration contains a destructive statement. Review it before deploying."; exit 1
          fi
          echo "No drop table/schema/column, truncate or delete statements found."
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify the target project
        run: |
          name=$(pnpm exec supabase projects list -o json | jq -r --arg ref "$PROJECT_REF" '.[] | select(.id == $ref or .ref == $ref) | .name')
          if [ "$name" != "$PROJECT_NAME" ]; then
            echo "::error::Project $PROJECT_REF is not '$PROJECT_NAME' (found '${name:-nothing}'). Stopping."; exit 1
          fi
          echo "Target confirmed: $name ($PROJECT_REF)"
      - name: Connect through the IPv4 session pooler
        # GitHub-hosted runners have no IPv6, and db.<ref>.supabase.co is IPv6
        # only. `supabase link` only finds the IPv4 pooler when the access
        # token has database_pooling_config_read, and silently skips it
        # otherwise, so every database command below gets an explicit
        # session pooler URL (port 5432) instead of relying on --linked.
        # Source: the SUPABASE_DB_URL secret if set, otherwise the pooler
        # address from the Management API plus SUPABASE_DB_PASSWORD.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            db_url="$SUPABASE_DB_URL"
            echo "Using the SUPABASE_DB_URL secret."
          else
            pooler_json=$(curl -sS --fail-with-body \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/config/database/pooler") || {
              echo "::error::Could not read the pooler address for $PROJECT_REF. Either add the SUPABASE_DB_URL secret (Supabase dashboard, Connect, Session pooler URI with the password filled in), or give SUPABASE_ACCESS_TOKEN the database_pooling_config_read permission."
              exit 1
            }
            read -r host user name < <(echo "$pooler_json" | jq -r \
              'map(select(.database_type == "PRIMARY")) | first // empty | "\(.db_host) \(.db_user) \(.db_name)"')
            test -n "$host" || { echo "::error::The Management API returned no primary pooler for $PROJECT_REF."; exit 1; }
            password=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p | @uri')
            echo "::add-mask::$password"
            db_url="postgresql://$user:$password@$host:5432/$name?sslmode=require"
            echo "Using the session pooler from the Management API."
          fi
          echo "::add-mask::$db_url"

          # Refuse anything that is not the QuickPro Preview session pooler.
          rest=${db_url#*://}
          creds=${rest%@*}
          hostport=${rest##*@}; hostport=${hostport%%[/?]*}
          db_host=${hostport%%:*}
          db_port=${hostport##*:}; [ "$db_port" = "$hostport" ] && db_port=5432
          db_user=${creds%%:*}
          case "$db_host" in
            *.pooler.supabase.com) ;;
            *) echo "::error::The database URL must use the Supabase pooler (*.pooler.supabase.com), not $db_host."; exit 1 ;;
          esac
          if [ "$db_user" != "postgres.$PROJECT_REF" ]; then
            echo "::error::The database URL is for user '$db_user', not postgres.$PROJECT_REF ($PROJECT_NAME). Stopping."; exit 1
          fi
          if [ "$db_port" != "5432" ]; then
            echo "::error::Use the session pooler (port 5432), not port $db_port. Migrations need session mode."; exit 1
          fi
          getent ahostsv4 "$db_host" >/dev/null || { echo "::error::$db_host has no IPv4 address."; exit 1; }

          echo "SUPABASE_DB_URL=$db_url" >> "$GITHUB_ENV"
          echo "Database: $db_host:$db_port as $db_user (IPv4)."
      - name: Migrations already applied
        run: pnpm exec supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Dry run (what apply would do)
        run: pnpm exec supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: Apply migrations
        if: inputs.mode == 'apply'
        run: pnpm exec supabase db push --db-url "$SUPABASE_DB_URL"
      - name: Migrations after
        if: inputs.mode == 'apply'
        run: pnpm exec supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Verify tables, row level security and storage bucket (read only)
        if: inputs.mode == 'apply'
        run: psql "$SUPABASE_DB_URL" -X -f supabase/checks/verify-deployment.sql
